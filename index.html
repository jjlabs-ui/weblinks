<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;cursor:none}
body{font-family:'Inter',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;transition:background 1s ease,color 1s ease}

body.v2{

  --t-muted:rgba(0,0,0,.62);
  --t-faint:rgba(0,0,0,.42);
  --t-card:rgba(255,255,255,.14);
  --t-card-hover:rgba(255,255,255,.28);
  --t-card-border:rgba(255,255,255,.38);
  --t-divider:rgba(0,0,0,.12);
  --t-shadow:0 24px 60px rgba(0,0,0,.18),0 0 0 1px rgba(255,255,255,.22);
  --t-tooltip-bg:rgba(10,10,10,.92);
  --t-tooltip-text:#fff;
  --t-splash:rgba(0,0,0,.72);
  --t-splash-ring:rgba(255,255,255,.12);
  --t-splash-ring-active:#fff;
  --t-splash-muted:rgba(255,255,255,.5);
  --t-splash-title:#fff;
  --t-splash-sub:rgba(255,255,255,.5);
  --t-splash-cta-bg:#fff;
  --t-splash-cta-text:#000;
  --t-splash-progress:rgba(255,255,255,.14);
  --t-splash-progress-fill:#fff;
  --t-cursor-shadow:rgba(0,0,0,.25);
  --t-music-btn-bg:rgba(255,255,255,.16);
  --t-music-btn-border:rgba(255,255,255,.35);
  --t-music-btn-color:#0a0a0a;
  --t-music-bar:#0a0a0a;
  --t-online-border:#fff;
  --t-bg-veil:linear-gradient(180deg,rgba(0,0,0,.04) 0%,rgba(0,0,0,.12) 55%,rgba(0,0,0,.22) 100%);
}

#cursor{
  position:fixed;
  pointer-events:none;
  z-index:99999;
  transform:translate(-50%,-50%);
}
#cursor svg{
  filter:drop-shadow(0 1px 3px var(--t-cursor-shadow,rgba(0,0,0,.22)));
  transition:transform .15s ease, filter .15s ease;
}
#cursor.clicking svg{
  transform:scale(0.7) rotate(15deg);
  filter:drop-shadow(0 2px 8px var(--t-cursor-shadow,rgba(0,0,0,.35)));
}
#bgVideo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#000}
#bgVideo::after{content:'';position:absolute;inset:0;background:var(--t-bg-veil,transparent);pointer-events:none}
#bgVideoEl{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(100%) contrast(1.04) brightness(.92)}

#splash{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  cursor:none;transition:opacity .8s ease,visibility .8s ease;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{
  display:flex;flex-direction:column;align-items:center;gap:28px;
  text-align:center;padding:32px 40px;max-width:420px;
}
.splash-loader{display:flex;flex-direction:column;align-items:center;gap:16px}
.splash-ring{
  width:52px;height:52px;border-radius:50%;
  border:2px solid var(--t-splash-ring,rgba(0,0,0,.08));
  border-top-color:var(--t-splash-ring-active,#121212);
  animation:splashSpin .85s linear infinite;
}
@keyframes splashSpin{to{transform:rotate(360deg)}}
.splash-status{
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.35em;text-transform:uppercase;color:var(--t-splash-muted,rgba(18,18,18,.42));
}
.splash-progress{
  width:160px;height:2px;border-radius:99px;background:var(--t-splash-progress,rgba(0,0,0,.08));overflow:hidden;
}
.splash-progress-fill{
  height:100%;width:0%;border-radius:99px;
  background:var(--t-splash-progress-fill,#121212);
  transition:width .25s ease;
}
.splash-enter{display:none;flex-direction:column;align-items:center;gap:14px;animation:splashFadeUp .6s ease both}
#splash.ready .splash-loader{display:none}
#splash.ready .splash-enter{display:flex}
@keyframes splashFadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.splash-title{
  font-family:'Instrument Serif',Georgia,serif;font-size:clamp(34px,7vw,48px);
  font-weight:400;letter-spacing:.04em;color:var(--t-splash-title,#fff);
  text-shadow:0 2px 20px rgba(0,0,0,.4);
}
.splash-sub{
  font-family:'Inter',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:.32em;text-transform:uppercase;color:var(--t-splash-sub,rgba(18,18,18,.48));
}
.splash-cta{
  margin-top:8px;padding:13px 32px;border-radius:999px;
  border:1px solid rgba(255,255,255,.15);
  background:var(--t-splash-cta-bg,#fff);
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.24em;text-transform:uppercase;color:var(--t-splash-cta-text,#000);
  animation:splashPulse 2.4s ease-in-out infinite;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
  transition:transform .2s ease,box-shadow .2s ease;
}
#splash.ready .splash-cta:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(0,0,0,.45)}
@keyframes splashPulse{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}

#app{position:relative;z-index:1;width:100%;display:flex;justify-content:center;padding:24px 24px;opacity:0;transition:opacity .7s ease}
#app.visible{opacity:1}



.tilt-card{
  position:relative;border-radius:28px;padding:28px 64px 44px;
  backdrop-filter:blur(28px) saturate(1.35);-webkit-backdrop-filter:blur(28px) saturate(1.35);
  transform-style:preserve-3d;
  transition:transform .1s ease,box-shadow .35s ease,background 1s,border-color 1s;
  will-change:transform;max-width:680px;width:100%;
  background:var(--t-card,rgba(255,255,255,.84));
  border:1px solid var(--t-card-border,rgba(255,255,255,.98));
  box-shadow:var(--t-shadow,0 28px 70px rgba(15,15,20,.14));
}
#app.visible .tilt-card{animation:cardReveal .85s cubic-bezier(.22,1,.36,1) both}
@keyframes cardReveal{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.tilt-card::before{content:'';position:absolute;inset:0;border-radius:28px;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.08) 0%,transparent 62%);pointer-events:none;opacity:0;transition:opacity .2s}
.tilt-card:hover::before{opacity:1}
.tilt-card::after{content:'';position:absolute;inset:-1px;border-radius:29px;background:linear-gradient(135deg,rgba(255,255,255,.12) 0%,transparent 42%,transparent 58%,rgba(255,255,255,.05) 100%);pointer-events:none;opacity:0;transition:opacity .3s}
.tilt-card:hover::after{opacity:1}

/* Glass 3D — mesmo efeito da borda principal (tilt-card) */
.glass-card{
  position:relative;
  transform-style:preserve-3d;
  transition:transform .12s ease,box-shadow .12s ease,background 1s,border-color 1s;
  overflow:hidden;
}
.glass-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(128,128,128,.09) 0%,transparent 62%);
  pointer-events:none;opacity:0;transition:opacity .2s;z-index:0;
}
.glass-card::after{
  content:'';position:absolute;inset:-1px;border-radius:inherit;
  background:linear-gradient(135deg,rgba(128,128,128,.14) 0%,transparent 42%,transparent 58%,rgba(128,128,128,.08) 100%);
  pointer-events:none;opacity:0;transition:opacity .3s;z-index:0;
}
.glass-card:hover::before,.glass-card.open::before{opacity:.85}
.glass-card:hover::after,.glass-card.open::after{opacity:1}
.glass-card-inner{
  position:relative;z-index:1;
  transform-style:preserve-3d;
  display:flex;flex-direction:column;gap:14px;width:100%;
}
.glass-card-inner > *{transform:translateZ(14px)}

.tilt-inner{transform-style:preserve-3d;display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.tilt-inner > *{transform:translateZ(18px);opacity:0;animation:itemIn .5s ease forwards}
.tilt-inner > *:nth-child(1){animation-delay:.1s}.tilt-inner > *:nth-child(2){animation-delay:.2s}.tilt-inner > *:nth-child(3){animation-delay:.3s}.tilt-inner > *:nth-child(4){animation-delay:.4s}.tilt-inner > *:nth-child(5){animation-delay:.5s}.tilt-inner > *:nth-child(6){animation-delay:.6s}.tilt-inner > *:nth-child(7){animation-delay:.7s}.tilt-inner > *:nth-child(8){animation-delay:.8s}.tilt-inner > *:nth-child(9){animation-delay:.9s}.tilt-inner > *:nth-child(10){animation-delay:1s}.tilt-inner > *:nth-child(11){animation-delay:1.1s}
@keyframes itemIn{from{opacity:0;transform:translateZ(18px) translateY(14px)}to{opacity:1;transform:translateZ(18px) translateY(0)}}

.views-badge{
  position:absolute;top:14px;right:16px;display:flex;align-items:center;gap:5px;
  border-radius:10px;padding:6px 10px;font-size:11px;font-weight:600;white-space:nowrap;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10;
  transition:background .8s,color .8s,border-color .8s,transform .2s;letter-spacing:.2px;
  background:var(--t-card,rgba(8,8,8,.78));border:1px solid var(--t-card-border,rgba(255,255,255,.1));color:var(--t-muted,rgba(255,255,255,.62));
}
.views-badge.pulse svg{animation:eyePulse .6s ease}
@keyframes eyePulse{0%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(0.9)}100%{transform:scale(1)}}
body.v2 .tilt-card{
  background:var(--t-card);
  border:1px solid var(--t-card-border);
  box-shadow:var(--t-shadow);
  backdrop-filter:blur(28px) saturate(1.35);
  -webkit-backdrop-filter:blur(28px) saturate(1.35);
  transition:background .35s ease,border-color .35s ease,box-shadow .35s ease;
}
body.v2 .tilt-card:hover{
  background:var(--t-card-hover);
}
body.v2 .views-badge{
  background:var(--t-card);
  border-color:var(--t-card-border);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
body.v2 #musicPanel{
  background:var(--t-card);
  border:1px solid var(--t-card-border);
  box-shadow:var(--t-shadow);
}
body.v2 #musicBtn{
  background:var(--t-music-btn-bg);
  border-color:var(--t-music-btn-border);
  color:var(--t-music-btn-color);
}
body.v2 #splash{background:var(--t-splash)}
body.v2 #actExpandBtn{color:#0a0a0a}
body.v2 .profile-card:hover{background:rgba(255,255,255,.22);border-color:rgba(0,0,0,.1)}
body.v2 .social-icon{color:#0a0a0a;opacity:.5}
body.v2 .social-icon:hover{opacity:1;background:rgba(255,255,255,.28);box-shadow:0 6px 18px rgba(0,0,0,.12)}
body.v2 .social-icon[title="Spotify"]:hover{color:#1DB954;background:rgba(29,185,84,.14)}
body.v2 .social-icon[title="Steam"]:hover{color:#111;background:rgba(0,0,0,.08)}
body.v2 .social-icon[title="Discord"]:hover{color:#5865F2;background:rgba(88,101,242,.14)}
body.v2 .social-icon[title="Twitch"]:hover{color:#9146FF;background:rgba(145,70,255,.14)}
body.v2 .social-icon[title="GitHub"]:hover{color:#0a0a0a;background:rgba(0,0,0,.08)}
body.v2 .badge-svg{color:#0a0a0a}
body.v2 .profile-tag{color:rgba(0,0,0,.62)!important}
body.v2 #discordStatus{color:rgba(0,0,0,.58)!important}

.avatar-ring{
  position:relative;
  width:108px;height:108px;
  border-radius:50%;
  overflow:hidden;
  flex-shrink:0;
}
.avatar{
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
}
.avatar{filter:grayscale(100%)}
.avatar-ring:hover .avatar{filter:grayscale(100%) !important}
.profile-avatar,#discordAvatarDecoration,#tagIcon img,#discordStatus img,.profile-badge-svg,.stt-banner img,.stt-icon img,.act-card img,.mp-cover{filter:none!important}

.name{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(24px,5vw,30px);font-weight:400;letter-spacing:.06em;margin-top:-4px;transition:color 1s,text-shadow 1s;position:relative;text-transform:lowercase;color:var(--t-text,#f5f5f5)}
.name::before,.name::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;color:inherit}
.name::before{animation:glitch1 5s infinite;clip-path:polygon(0 0,100% 0,100% 35%,0 35%);opacity:0}
.name::after{animation:glitch2 5s infinite;clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);opacity:0}
@keyframes glitch1{0%,88%,100%{opacity:0}90%{opacity:.7;transform:translateX(-4px)}92%{opacity:0}95%{opacity:.4;transform:translateX(3px)}97%{opacity:0}}
@keyframes glitch2{0%,88%,100%{opacity:0}91%{opacity:.6;transform:translateX(4px)}93%{opacity:0}96%{opacity:.3;transform:translateX(-3px)}98%{opacity:0}}
.badges-row{display:flex;gap:8px;align-items:center;margin-top:-6px}
.badge-svg{font-size:22px;opacity:.85;transition:transform .2s,opacity .2s;cursor:default;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;user-select:none}
.badge-svg:hover{transform:scale(1.4) translateY(-3px);opacity:1}
.badge-svg::after{content:attr(title);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--t-tooltip-bg,#111);border-radius:12px;color:var(--t-tooltip-text,#fff);font-size:12px;font-family:'Inter',sans-serif;font-weight:700;letter-spacing:.5px;padding:7px 16px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.badge-svg:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}

.divider{width:100%;height:1px;transition:background 1s;margin:2px 0;background:var(--t-divider,rgba(255,255,255,.1))}

.socials-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.social-icon{
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;text-decoration:none;
  transition:color .2s,transform .2s,opacity .2s,background .2s,box-shadow .2s;
  background:transparent;border:none;position:relative;opacity:.5;color:var(--t-text,#f5f5f5);
  border-radius:50%;
}
.social-icon::after{content:attr(title) ' →';position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--t-tooltip-bg,#111);border-radius:12px;color:var(--t-tooltip-text,#fff);font-size:12px;font-family:'Inter',sans-serif;font-weight:600;padding:7px 14px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.social-icon:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
.social-icon:hover{transform:translateY(-4px)}

.profile-card{
  display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:inherit;width:100%;
  padding:12px 14px;border-radius:16px;transition:background .25s,border .25s,transform .2s;
  border:1px solid transparent;background:transparent;
}
.profile-card:hover{filter:none;transform:translateY(-1px)}
.profile-card-left{display:flex;align-items:center;gap:12px}
.profile-avatar-wrap{position:relative;width:46px;height:46px;flex-shrink:0;overflow:visible;}
.profile-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;transition:transform .3s,filter .8s}
.profile-card:hover .profile-avatar{transform:scale(1.08)}
.online-dot{position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;line-height:0;z-index:3;box-shadow:none;border:none}
.online-dot::after{display:none}
.profile-text{display:flex;flex-direction:column;gap:3px}
.profile-username{font-size:13px;font-weight:600;transition:color 1s}
.profile-badges{display:flex;gap:4px;margin-top:4px;align-items:center;flex-wrap:wrap}
.profile-badge-svg{width:20px;height:20px;opacity:.9;object-fit:contain;flex-shrink:0}

.ripple{position:fixed;border-radius:50%;transform:scale(0);animation:rippleAnim .6s ease-out forwards;pointer-events:none;z-index:9997}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}
@keyframes sparkFade{0%{transform:translate(-50%,-50%) rotate(45deg) scale(1);opacity:.8}100%{transform:translate(calc(-50% + var(--tx,0px)),calc(-50% + var(--ty,0px))) rotate(45deg) scale(0);opacity:0}}
@keyframes burstFade{0%{transform:translate(-50%,-50%) rotate(45deg) scale(1);opacity:.9}100%{transform:translate(calc(-50% + var(--tx,0px)),calc(-50% + var(--ty,0px))) rotate(45deg) scale(0);opacity:0}}

.name-particle{position:fixed;width:2px;height:2px;border-radius:50%;pointer-events:none;animation:particleFly var(--dur,1.5s) ease-out forwards;z-index:9998}
@keyframes particleFly{0%{transform:translate(0,0) scale(1);opacity:.8}100%{transform:translate(var(--tx,0px),var(--ty,-40px)) scale(0);opacity:0}}
@media(max-width:600px){
  .tilt-card{padding:20px 14px 20px !important;border-radius:16px !important;transform:none !important}
  .tilt-card:hover{transform:none !important}
  .tilt-card::before,.tilt-card::after{display:none !important}
  .name{font-size:22px !important}
  .badges-row{gap:8px !important;flex-wrap:wrap;justify-content:center}
  .socials-row{gap:12px !important}
  .social-icon{width:34px !important;height:34px !important}
  .social-icon::after{display:none !important}
  .badge-svg::after{display:none !important}
  .tilt-inner > *{transform:none !important}
  .act-card{padding:8px 12px !important}
  .profile-card{padding:10px 12px !important}
  #cursor{display:none !important}
  *{cursor:auto !important}
  #musicWidget{top:10px !important;right:10px !important}
  #musicBtn{width:34px !important;height:34px !important}
  #musicPanel{width:250px !important;right:-10px !important;transform:none !important}
  #musicPanel::before,#musicPanel::after{display:none !important}
}

/* ── Music widget fixo ── */
#musicWidget{
  position:fixed;top:20px;right:20px;z-index:5000;
}
#musicBtn{
  width:42px;height:42px;border-radius:50%;
  background:var(--t-music-btn-bg,rgba(255,255,255,.88));
  border:1px solid var(--t-music-btn-border,rgba(0,0,0,.07));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:center;
  cursor:none;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s;
  color:var(--t-music-btn-color,rgba(18,18,18,.72));
  gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.08);
}
#musicBtn:hover{background:rgba(255,255,255,.28);border-color:rgba(0,0,0,.15);transform:scale(1.06);box-shadow:0 12px 28px rgba(0,0,0,.12)}

.mb-bar{
  width:3px;border-radius:2px;
  background:var(--t-music-bar,#121212);
  transform-origin:bottom;
  transition:height .08s ease;
  height:4px;
}

/* ícone de nota musical (pausado) */
#mbNote{
  position:absolute;
  opacity:0;
  transition:opacity .4s ease, transform .4s ease;
  transform:scale(0.6) rotate(-15deg);
  pointer-events:none;
}
#musicBtn.paused #mbNote{
  opacity:1;
  transform:scale(1) rotate(0deg);
  animation:noteBob 2s ease-in-out infinite;
}
#musicBtn.paused .mb-bar{
  opacity:0;
  transition:opacity .3s ease;
}
#musicBtn:not(.paused) .mb-bar{
  opacity:1;
}
@keyframes noteBob{
  0%,100%{transform:scale(1) rotate(-5deg) translateY(0)}
  50%{transform:scale(1.1) rotate(5deg) translateY(-2px)}
}
#musicPanel{
  position:absolute;top:54px;right:0;
  width:340px;padding:16px;border-radius:22px;

.mp-top{display:flex;align-items:center;gap:14px;}
.mp-meta{flex:1;min-width:0;}
.mp-bar-row{display:flex;align-items:center;gap:8px;}
.mp-controls{display:flex;align-items:center;justify-content:center;gap:10px;}
.mp-vol{display:flex;align-items:center;gap:6px;padding:0 2px;}
.mp-bar:hover .mp-thumb{opacity:1}
input.mp-vol-slider::-webkit-slider-thumb:hover{transform:scale(1.3);}
.mp-cover{width:58px;height:58px;border-radius:12px;object-fit:cover;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,.35);}
.mp-title{font-size:13.5px;font-weight:700;color:var(--t-text,#f5f5f5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;}
.mp-artist{font-size:11px;color:var(--t-muted,rgba(255,255,255,.62));margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mp-time{font-size:10px;color:var(--t-faint,rgba(255,255,255,.38));font-variant-numeric:tabular-nums;min-width:32px;}
.mp-bar{flex:1;height:4px;background:var(--t-faint,rgba(0,0,0,.12));border-radius:99px;position:relative;cursor:none;}
.mp-fill{height:100%;background:var(--t-music-bar,#0a0a0a);border-radius:99px;width:0%;transition:width .1s linear;}
.mp-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;background:var(--t-music-bar,#0a0a0a);border-radius:50%;opacity:0;transition:opacity .15s;pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.6);}
.mp-play{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid transparent;cursor:none;display:flex;align-items:center;justify-content:center;color:#000;transition:background .2s,transform .15s;flex-shrink:0;}
.mp-play:hover{background:#e8e8e8;transform:scale(1.08)}
.mp-skip-btn{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.1);cursor:none;display:flex;align-items:center;justify-content:center;color:var(--t-muted,rgba(0,0,0,.62));transition:background .2s,color .2s,transform .15s;flex-shrink:0;}
.mp-skip-btn:hover{background:rgba(0,0,0,.1);color:#0a0a0a;transform:scale(1.08)}
.mp-vol svg{flex-shrink:0;color:var(--t-faint,rgba(255,255,255,.38));}
input.mp-vol-slider{-webkit-appearance:none;appearance:none;flex:1;height:3px;background:rgba(0,0,0,.12);border-radius:99px;outline:none;cursor:none;}
input.mp-vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#0a0a0a;cursor:none;box-shadow:0 0 0 2px rgba(255,255,255,.5);transition:transform .15s;}
input.mp-vol-slider::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#0a0a0a;border:none;cursor:none;box-shadow:0 0 0 2px rgba(255,255,255,.5);}

/* ── Server Tag Tooltip ── */
.server-tag-wrap{position:relative;z-index:100;}
.server-tag-wrap:hover .profile-tag,
.server-tag-wrap.stt-open .profile-tag{border-color:transparent!important;background:rgba(255,255,255,.06)!important;box-shadow:none;color:var(--t-text,#f5f5f5)!important;}
/* Ponte invisível tag → card (evita fechar no vão) */
.server-tag-wrap.stt-open::before{
  content:'';position:absolute;right:0;bottom:100%;
  width:280px;height:20px;pointer-events:auto;
}
.server-tooltip{
  position:absolute;bottom:calc(100% - 4px);right:0;
  width:280px;z-index:99999;
  display:flex;flex-direction:column;
  background:#0a0a0a;
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  opacity:0;visibility:hidden;transform:translateY(6px);
  transition:opacity .15s,visibility .15s,transform .15s;
  pointer-events:none;
}
.server-tooltip.stt-hidden{display:none!important;}
.server-tag-wrap:hover .server-tooltip:not(.stt-hidden),
.server-tag-wrap.stt-open .server-tooltip:not(.stt-hidden){
  opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;
}
.stt-banner-wrap{
  position:relative;height:86px;flex-shrink:0;overflow:visible;
}
.stt-banner{
  position:absolute;inset:0;overflow:hidden;
  background:rgba(255,255,255,.04);
}
.stt-banner img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;pointer-events:none}
.stt-banner-wrap::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:48px;
  background:linear-gradient(to bottom,transparent,rgba(0,0,0,.5));
  pointer-events:none;z-index:1;
}
.stt-icon{
  position:absolute;left:14px;bottom:-22px;
  width:48px;height:48px;border-radius:12px;
  border:3px solid #0a0a0a;
  background:#0a0a0a;
  box-shadow:0 4px 18px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#fff;
  margin:0;z-index:3;overflow:hidden;
}
.stt-icon img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.stt-body{
  position:relative;z-index:0;
  padding:28px 14px 12px;
  display:flex;flex-direction:column;gap:6px;
  background:#0a0a0a;
}
.stt-name{font-size:14px;font-weight:700;color:#fff;display:flex;align-items:center;gap:4px;}
.stt-stats{display:flex;align-items:center;gap:10px;font-size:11px;color:rgba(255,255,255,.5);}
.stt-join{
  display:flex;align-items:center;justify-content:center;
  margin-top:8px;padding:9px 12px;border-radius:8px;
  background:#5865F2;color:#fff;font-size:12px;font-weight:600;
  font-family:'Inter',sans-serif;text-decoration:none;
  transition:background .15s,transform .15s;letter-spacing:.2px;
  cursor:pointer;
}
.stt-join:hover{background:#4752C4;transform:translateY(-1px);}
.stt-join.stt-join-off{opacity:.45;pointer-events:none;background:#4f545c;color:#dcddde;}
.stt-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle;}
.stt-dot.on{background:#23a559;}
.stt-dot.off{background:#80848e;}
.stt-desc{font-size:11px;color:rgba(255,255,255,.5);margin-top:4px;line-height:1.4;}

  <script>
  var actExpanded = true; // Começa aberto
  var actAutoTimer = null;
  var actFirstLoad = true;
  var cachedIconUrls = {}; // Cache de ícones já buscados
  var lastCardsKey = ''; // Pra saber se precisa reconstruir

  function toggleActivities(){
    actExpanded = !actExpanded;
    var chevron = document.getElementById('actChevron');
    var expandBtn = document.getElementById('actExpandBtn');
    var cards = document.querySelectorAll('.act-card.act-secondary-card');

    clearTimeout(actAutoTimer);

    if(actExpanded){
      chevron.classList.add('up');
      expandBtn.classList.remove('hint');
      cards.forEach(function(c, i){
        // Remove hidden class primeiro
        c.classList.remove('act-hidden');
        // Força estado inicial
        c.style.transition = 'none';
        c.style.opacity = '0';
        c.style.maxHeight = '0';
        c.style.transform = 'translateY(-20px)';
        c.style.paddingTop = '0';
        c.style.paddingBottom = '0';
        c.style.marginTop = '0';
        c.style.borderColor = 'transparent';
        c.style.borderWidth = '0';
        c.style.overflow = 'hidden';
        // Força reflow
        c.offsetHeight;
        // Anima pra estado final com delay
        setTimeout(function(){
          c.style.transition = 'all .4s cubic-bezier(.25,.46,.45,.94)';
          c.style.opacity = '1';
          c.style.maxHeight = '150px';
          c.style.transform = 'translateY(0)';
          c.style.paddingTop = '10px';
          c.style.paddingBottom = '10px';
          c.style.marginTop = '';
          c.style.borderColor = 'rgba(0,0,0,.12)';
          c.style.borderWidth = '1px';
          c.style.overflow = '';
        }, i * 120);
      });
      actAutoTimer = setTimeout(function(){
        if(actExpanded) toggleActivities();
      }, 15000);
    } else {
      chevron.classList.remove('up');
      var total = cards.length;
      cards.forEach(function(c, i){
        var delay = (total - 1 - i) * 120;
        setTimeout(function(){
          c.style.transition = 'all .35s cubic-bezier(.55,.06,.68,.19)';
          c.style.opacity = '0';
          c.style.maxHeight = '0';
          c.style.transform = 'translateY(-20px)';
          c.style.paddingTop = '0';
          c.style.paddingBottom = '0';
          c.style.borderColor = 'transparent';
          c.style.borderWidth = '0';
          c.style.overflow = 'hidden';
          // Depois da animação, adiciona a classe
          setTimeout(function(){
            c.classList.add('act-hidden');
          }, 350);
        }, delay);
      });
      setTimeout(function(){
        expandBtn.classList.add('hint');
      }, total * 120 + 400);
    }
  }

  function buildActivityCards(data) {
    var container = document.getElementById('actContainer');
    var wrap = document.getElementById('activityWrap');
    var btn = document.getElementById('actExpandBtn');
    if (!container) return;

    var cards = [];

    // Cards transparentes — cor só no hover (CSS)
    var ACT_GLASS = {label:'rgba(0,0,0,.55)'};

    var editorApps = ['Visual Studio Code', 'Visual Studio', 'IntelliJ IDEA', 'WebStorm', 'Sublime Text', 'Neovim', 'Cursor', 'Code', 'VSCode', 'VS Code'];

    // Lista de jogos conhecidos pra garantir prioridade máxima
    var knownGames = ['VALORANT', 'League of Legends', 'Counter-Strike', 'Minecraft', 'Fortnite', 'GTA', 'Dead by Daylight', 'Roblox', 'Apex Legends', 'Overwatch', 'Call of Duty', 'Black Ops', 'Warzone', 'Rainbow Six', 'Rocket League', 'FIFA', 'EA FC', 'Dota', 'Rust', 'ARK', 'Terraria', 'Among Us', 'Fall Guys', 'Genshin', 'Honkai'];

    // 1. Coletar atividades tipo 0 (jogos/apps) — sem duplicatas
    var seenNames = [];
    if (data.activities) {
      for (var i = 0; i < data.activities.length; i++) {
        var act = data.activities[i];
        if (act.type === 0) {
          var actName = act.name || '';
          // Normaliza nome pra comparação (remove ®, ™, :, espaços extras)
          var normalized = actName.replace(/[®™:©]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
          
          // Verifica se já tem um card similar
          var isDuplicate = false;
          for (var s = 0; s < seenNames.length; s++) {
            // Se um nome contém o outro ou são muito parecidos
            if (seenNames[s].indexOf(normalized) !== -1 || normalized.indexOf(seenNames[s]) !== -1) {
              isDuplicate = true;
              break;
            }
          }
          if (isDuplicate) continue;
          seenNames.push(normalized);

          var isEditor = editorApps.some(function(e){ return actName.toLowerCase().indexOf(e.toLowerCase()) !== -1; });
          var isKnownGame = knownGames.some(function(g){ return actName.toLowerCase().indexOf(g.toLowerCase()) !== -1; });
          // Jogo conhecido = prioridade 1 (sempre visível), editor = 2, outro app = 1
          var priority = isKnownGame ? 1 : (isEditor ? 2 : 1);

          // Imagem
          var imgUrl = '';
          var appId = act.application_id || '';
          if (act.assets && act.assets.large_image) {
            if (act.assets.large_image.startsWith('mp:')) {
              imgUrl = 'https://media.discordapp.net/' + act.assets.large_image.replace('mp:', '');
            } else if (act.assets.large_image.startsWith('spotify:')) {
              imgUrl = 'https://i.scdn.co/image/' + act.assets.large_image.replace('spotify:', '');
            } else if (appId) {
              imgUrl = 'https://cdn.discordapp.com/app-assets/' + appId + '/' + act.assets.large_image + '.png?size=128';
            }
          }
          // Fallback: usa cache ou marca pra fetch
          if (!imgUrl && appId) {
            if (cachedIconUrls[appId]) {
              imgUrl = cachedIconUrls[appId];
            } else {
              imgUrl = '__FETCH__' + appId;
            }
          }

          var color = ACT_GLASS;

          cards.push({
            id: act.name + '_' + appId,
            priority: priority,
            name: act.name || '',
            detail: act.details || '',
            state: act.state || '',
            img: imgUrl,
            appId: appId,
            color: color,
            label: isEditor ? 'programando' : 'jogando'
          });
        }
      }
    }

    // 2. Spotify (prioridade 3)
    if (data.listening_to_spotify && data.spotify) {
      var sp = data.spotify;
      var pct = 0;
      var spElapsed = 0;
      var spDuration = 0;
      if (sp.timestamps) {
        var now = Date.now();
        spElapsed = Math.min(Math.floor((now - sp.timestamps.start) / 1000), Math.floor((sp.timestamps.end - sp.timestamps.start) / 1000));
        spDuration = Math.floor((sp.timestamps.end - sp.timestamps.start) / 1000);
        pct = Math.min(100, (spElapsed / spDuration) * 100);
      }
      cards.push({
        id: 'spotify',
        priority: 3,
        name: sp.song || '',
        detail: sp.artist || '',
        state: '',
        img: sp.album_art_url || '',
        appId: '',
        color: ACT_GLASS,
        label: 'ouvindo agora',
        isSpotify: true,
        progress: pct,
        elapsed: spElapsed,
        duration: spDuration,
        startTs: sp.timestamps ? sp.timestamps.start : 0,
        endTs: sp.timestamps ? sp.timestamps.end : 0
      });
    }

    cards.sort(function(a,b){ return a.priority - b.priority; });

    var newKey = cards.map(function(c){ return c.id; }).join('|');
    var needsRebuild = (newKey !== lastCardsKey);
    var oldKey = lastCardsKey;

    if (cards.length === 0 && lastCardsKey !== '') {
      // Tudo sumiu — anima saída de todos e esconde
      lastCardsKey = '';
      var allCards = container.querySelectorAll('.act-card');
      allCards.forEach(function(c, i) {
        c.style.transition = 'opacity .3s ease ' + (i * 50) + 'ms, transform .3s ease ' + (i * 50) + 'ms';
        c.style.opacity = '0';
        c.style.transform = 'translateY(-8px) scale(.95)';
      });
      setTimeout(function() {
        container.innerHTML = '';
        if (wrap) wrap.style.display = 'none';
        if (btn) btn.style.display = 'none';
      }, 350 + (allCards.length * 50));
      return;
    }

    if (cards.length === 0) {
      if (wrap) wrap.style.display = 'none';
      return;
    }
    if (wrap) wrap.style.display = 'block';

    if (needsRebuild) {
      var oldIds = oldKey ? oldKey.split('|') : [];
      var newIds = newKey.split('|');
      var removedIds = oldIds.filter(function(id){ return newIds.indexOf(id) === -1; });
      var addedIds = newIds.filter(function(id){ return oldIds.indexOf(id) === -1; });

      // Anima saída dos cards removidos, depois reconstrói só se necessário
      if (removedIds.length > 0 && oldKey !== '') {
        lastCardsKey = newKey;
        var removeCount = removedIds.length;
        var removed = 0;
        removedIds.forEach(function(id) {
          var el = container.querySelector('[data-card-id="' + id + '"]');
          if (el) {
            el.style.transition = 'opacity .3s ease, transform .3s ease, max-height .35s ease .05s, padding .3s ease, border-width .3s ease, margin .3s ease';
            el.style.opacity = '0';
            el.style.transform = 'translateY(-15px) scale(.95)';
            el.style.maxHeight = '0';
            el.style.paddingTop = '0';
            el.style.paddingBottom = '0';
            el.style.borderWidth = '0';
            el.style.marginTop = '0';
            el.style.marginBottom = '0';
            el.style.overflow = 'hidden';
          }
        });
        // Depois da animação de saída, reconstrói com os cards restantes
        setTimeout(function() {
          renderCards(container, cards, btn);
        }, 400);
      }
      // Só adicionou cards
      else if (addedIds.length > 0 && removedIds.length === 0) {
        lastCardsKey = newKey;
        renderCards(container, cards, btn);
      }
      // Mudança complexa
      else {
        lastCardsKey = newKey;
        renderCards(container, cards, btn);
      }
    } else {
      // Só atualiza textos, imagem e progresso sem reconstruir DOM
      for (var c = 0; c < cards.length; c++) {
        var card = cards[c];
        var el = container.querySelector('[data-card-id="' + card.id + '"]');
        if (!el) continue;
        var nameEl = el.querySelector('[data-name]');
        var detailEl = el.querySelector('[data-detail]');
        var stateEl = el.querySelector('[data-state]');
        if (nameEl && nameEl.textContent !== card.name) nameEl.textContent = card.name;
        if (detailEl && detailEl.textContent !== (card.detail || '')) detailEl.textContent = card.detail || '';
        if (stateEl && stateEl.textContent !== (card.state || '')) stateEl.textContent = card.state || '';
        // Spotify: atualiza timestamps, barra, tempo e imagem
        if (card.isSpotify) {
          var progressEl = el.querySelector('[data-progress]');
          var elapsedEl = el.querySelector('[data-elapsed]');
          var durationEl = el.querySelectorAll('span');
          var imgEl = el.querySelector('img');
          if (progressEl) {
            progressEl.setAttribute('data-start', card.startTs);
            progressEl.setAttribute('data-end', card.endTs);
            progressEl.style.width = card.progress + '%';
          }
          if (elapsedEl) {
            var m = Math.floor(card.elapsed / 60);
            var s = card.elapsed % 60;
            elapsedEl.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
          }
          // Atualiza duração total (último span com min-width:32px e text-align:right)
          var durSpan = el.querySelector('span[style*="text-align:right"]') || (durationEl.length > 0 ? durationEl[durationEl.length - 1] : null);
          if (durSpan && card.duration) {
            var dm = Math.floor(card.duration / 60);
            var ds = card.duration % 60;
            durSpan.textContent = (dm < 10 ? '0' : '') + dm + ':' + (ds < 10 ? '0' : '') + ds;
          }
          if (imgEl && card.img && imgEl.src !== card.img) {
            imgEl.style.transition = 'opacity .3s';
            imgEl.style.opacity = '0';
            setTimeout(function(img, url){ return function(){ img.src = url; img.style.opacity = '1'; }; }(imgEl, card.img), 150);
          }
        }
      }
    }

    if (btn) btn.style.display = cards.length > 1 ? 'block' : 'none';
  }

  function createCardElement(card, index, total) {
      var div = document.createElement('div');
      var isSecondary = index > 0;
      div.className = 'act-card' + (card.isSpotify ? ' act-spotify' : ' act-game') + (isSecondary ? ' act-secondary-card' + (actExpanded ? '' : ' act-hidden') : '');
      if (!isSecondary || actExpanded) {
        div.style.border = '1px solid rgba(0,0,0,.12)';
      } else {
        div.style.border = '0 solid transparent';
      }
      div.style.opacity = '0';
      div.style.transform = 'translateY(10px) scale(.95)';

      var imgHtml = '';
      if (card.img && card.img.startsWith('__FETCH__')) {
        // Mostra placeholder imediatamente com a inicial
        var initial = (card.name || '?').charAt(0).toUpperCase();
        var canvas = document.createElement('canvas');
        canvas.width = 54; canvas.height = 54;
        var ctx0 = canvas.getContext('2d');

        imgHtml = '<img data-fetch-icon="' + card.appId + '" src="' + canvas.toDataURL() + '" style="width:54px;height:54px;border-radius:12px;object-fit:cover;flex-shrink:0;" />';
      } else if (card.img) {
        imgHtml = '<img src="' + card.img + '" style="width:54px;height:54px;border-radius:12px;object-fit:cover;flex-shrink:0;" onerror="this.style.opacity=\'0.3\'" />';
      }

      var progressHtml = '';
      if (card.isSpotify) {
        var elMin = Math.floor(card.elapsed / 60);
        var elSec = card.elapsed % 60;
        var durMin = Math.floor(card.duration / 60);
        var durSec = card.duration % 60;
        var elStr = (elMin < 10 ? '0' : '') + elMin + ':' + (elSec < 10 ? '0' : '') + elSec;
        var durStr = (durMin < 10 ? '0' : '') + durMin + ':' + (durSec < 10 ? '0' : '') + durSec;
        progressHtml = '<div style="display:flex;align-items:center;gap:8px;margin-top:6px;">' +
          '<span data-elapsed class="act-time">' + elStr + '</span>' +
          '<div class="act-bar-track"><div data-progress data-start="' + card.startTs + '" data-end="' + card.endTs + '" class="act-bar-fill" style="width:' + card.progress + '%;"></div></div>' +
          '<span class="act-time" style="text-align:right;">' + durStr + '</span>' +
          '</div>';
      }

      var spotifyIcon = card.isSpotify ? '<svg class="act-spotify-icon" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>' : '';

      div.innerHTML = imgHtml +
        '<div style="flex:1;min-width:0;">' +
          '<div style="display:flex;align-items:center;gap:5px;margin-bottom:2px;">' + spotifyIcon +
            '<span data-act-label>' + card.label + '</span>' +
          '</div>' +
          '<div data-name>' + card.name + '</div>' +
          '<div data-detail>' + (card.detail || '') + '</div>' +
          '<div data-state>' + (card.state || '') + '</div>' +
          progressHtml +
        '</div>';

      // Fetch ícone se necessário — múltiplos fallbacks
      var fetchImg = div.querySelector('[data-fetch-icon]');
      if (fetchImg) {
        var appId = fetchImg.getAttribute('data-fetch-icon');
        var tried = 0;

        function tryFetchIcon(id, el) {
          fetch('https://discord.com/api/v10/applications/' + id + '/rpc')
            .then(function(r) { return r.json(); })
            .then(function(app) {
              if (app.icon) {
                var url = 'https://cdn.discordapp.com/app-icons/' + id + '/' + app.icon + '.png?size=128';
                cachedIconUrls[id] = url;
                var tmp = new Image();
                tmp.onload = function() { el.src = url; };
                tmp.onerror = function() { tryFallback(id, el); };
                tmp.src = url;
              } else {
                tryFallback(id, el);
              }
            }).catch(function(){ tryFallback(id, el); });
        }

        function tryFallback(id, el) {
          var url2 = 'https://cdn.discordapp.com/app-icons/' + id + '/icon.png?size=128';
          var img2 = new Image();
          img2.onload = function() { cachedIconUrls[id] = url2; el.src = url2; };
          img2.onerror = function() { /* mantém o placeholder */ };
          img2.src = url2;
        }

        if (cachedIconUrls[appId]) {
          fetchImg.src = cachedIconUrls[appId];
        } else {
          tryFetchIcon(appId, fetchImg);
        }
      }

      return div;
  }

  function renderCards(container, cards, btn) {
      container.innerHTML = '';

      for (var c = 0; c < cards.length; c++) {
        var div = createCardElement(cards[c], c, cards.length);
        container.appendChild(div);
        (function(el, delay){ setTimeout(function(){ el.style.transition='opacity .35s ease,transform .35s ease'; el.style.opacity='1'; el.style.transform='translateY(0) scale(1)'; }, delay); })(div, 60 * c);
      }

      // Auto-fecha na primeira vez depois de 15s
      if (actFirstLoad) {
        actFirstLoad = false;
        var chevron = document.getElementById('actChevron');
        if (chevron) chevron.classList.add('up');
        actAutoTimer = setTimeout(function(){
          if(actExpanded) toggleActivities();
        }, 15000);
      }

      if (btn) btn.style.display = cards.length > 1 ? 'block' : 'none';
  }

<script>

var IS_MOBILE = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 700;

// Mídia em /public/ (Vercel serve a pasta com esse prefixo)
var MEDIA_BASE = '/public/';
function mediaUrl(file){ return encodeURI(MEDIA_BASE + file.replace(/^\//, '')); }

// ── Background video (local MP4) ──
var BG_VIDEO_CANDIDATES = ['/bg-video.mp4', mediaUrl('bg-video.mp4')];
var BG_VIDEO_TIMEOUT = IS_MOBILE ? 3500 : 9000;
var bgVideoCandidateIdx = 0;
var bgVideoReady = false;
var bgVideoEl = null;

function setSplashProgress(pct, label) {
  var bar = document.getElementById('splashProgress');
  var status = document.getElementById('splashStatus');
  if (bar) bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
  if (status && label) status.textContent = label;
}

function markBgVideoReady(fallback) {
  if (bgVideoReady) return;
  bgVideoReady = true;
  setSplashProgress(100, fallback ? (IS_MOBILE ? 'toque para entrar' : 'sem vídeo — clique para entrar') : 'pronto');
  if (splash) splash.classList.add('ready');
}

function setBgVideoSource() {
  if (!bgVideoEl) return;
  if (bgVideoCandidateIdx >= BG_VIDEO_CANDIDATES.length) {
    markBgVideoReady(true);
    return;
  }
  bgVideoEl.src = BG_VIDEO_CANDIDATES[bgVideoCandidateIdx++];
  bgVideoEl.load();
}

function initBgVideoPreload() {
  bgVideoEl = document.getElementById('bgVideoEl');
  if (!bgVideoEl) {
    markBgVideoReady(true);
    return;
  }

  bgVideoEl.preload = IS_MOBILE ? 'metadata' : 'auto';
  bgVideoEl.setAttribute('playsinline', '');
  bgVideoEl.setAttribute('webkit-playsinline', '');
  setSplashProgress(5, IS_MOBILE ? 'preparando' : 'carregando vídeo');

  bgVideoEl.addEventListener('loadedmetadata', function() {
    setSplashProgress(IS_MOBILE ? 60 : 35, IS_MOBILE ? 'toque para entrar' : 'carregando vídeo');
    if (IS_MOBILE) markBgVideoReady(false);
  });

  bgVideoEl.addEventListener('progress', function() {
    if (!bgVideoEl.buffered.length || !bgVideoEl.duration) return;
    var end = bgVideoEl.buffered.end(bgVideoEl.buffered.length - 1);
    var pct = Math.min(92, Math.round((end / bgVideoEl.duration) * 100));
    setSplashProgress(pct, IS_MOBILE ? 'toque para entrar' : 'carregando vídeo');
  });

  bgVideoEl.addEventListener('canplay', function() {
    if (bgVideoEl.readyState >= 2) markBgVideoReady(false);
  });

  if (!IS_MOBILE) {
    bgVideoEl.addEventListener('canplaythrough', function() { markBgVideoReady(false); });
  }

  bgVideoEl.addEventListener('error', function() {
    setBgVideoSource();
  });

  setBgVideoSource();

  setTimeout(function() {
    if (!bgVideoReady) markBgVideoReady(true);
  }, BG_VIDEO_TIMEOUT);
}

function startBgVideo() {
  if (!bgVideoEl) bgVideoEl = document.getElementById('bgVideoEl');
  if (!bgVideoEl || !bgVideoEl.src) return;
  bgVideoEl.play().catch(function(){});
}

initBgVideoPreload();

var cur=document.getElementById('cursor');
var mouseX=window.innerWidth/2, mouseY=window.innerHeight/2;
var curX=mouseX, curY=mouseY;
var lastSparkX=mouseX, lastSparkY=mouseY;

if (!IS_MOBILE) {
  document.addEventListener('mousemove',function(e){
    mouseX=e.clientX; mouseY=e.clientY;
    var dx=mouseX-lastSparkX, dy=mouseY-lastSparkY;
    if(Math.sqrt(dx*dx+dy*dy) > 18) {
      lastSparkX=mouseX; lastSparkY=mouseY;
      var s=document.createElement('div');
      var size=Math.random()*4+3;
      var angle=Math.random()*360;
      var dist=Math.random()*6+3;
      var tx=Math.cos(angle*Math.PI/180)*dist;
      var ty=Math.sin(angle*Math.PI/180)*dist;
      var dur=(Math.random()*.35+.3).toFixed(2);
      s.style.cssText='position:fixed;pointer-events:none;z-index:9994;'+
        'left:'+mouseX+'px;top:'+mouseY+'px;'+
        'width:'+size+'px;height:'+size+'px;'+
        'transform:translate(-50%,-50%) rotate(45deg);'+
        'background:rgba(255,255,255,'+(Math.random()*.25+.12)+');'+
        'box-shadow:0 0 4px rgba(255,255,255,.2);'+
        'animation:sparkFade '+dur+'s ease-out forwards';
      s.style.setProperty('--tx', tx+'px');
      s.style.setProperty('--ty', ty+'px');
      document.body.appendChild(s);
      setTimeout(function(el){el.remove()},600,s);
    }
  });

  document.addEventListener('mousedown',function(){
    cur.classList.add('clicking');
    for(var i=0;i<6;i++){
      var s=document.createElement('div');
      var angle=i*60+Math.random()*20;
      var dist=14+Math.random()*10;
      s.style.cssText='position:fixed;pointer-events:none;z-index:9994;'+
        'left:'+mouseX+'px;top:'+mouseY+'px;'+
        'width:4px;height:4px;'+

        'background:rgba(255,255,255,.85);'+
        'box-shadow:0 0 6px rgba(255,255,255,.35);'+
        'animation:burstFade .4s ease-out forwards';
      s.style.setProperty('--tx', (Math.cos(angle*Math.PI/180)*dist)+'px');
      s.style.setProperty('--ty', (Math.sin(angle*Math.PI/180)*dist)+'px');

      setTimeout(function(el){el.remove()},500,s);

  });

  (function animCursor(){
    curX+=(mouseX-curX)*.5; curY+=(mouseY-curY)*.5;
    cur.style.left=curX+'px'; cur.style.top=curY+'px';
    requestAnimationFrame(animCursor);
  })();

// ── Views counter (+1 a cada entrada / F5 via API Vercel) ─
(function(){
  var el = document.getElementById('viewCount');

  function animateCount(target) {
    if (!el) return;
    var duration = 1200;
    var startTime = null;
    function step(ts) {
      if (!startTime) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var eased = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
      el.textContent = Math.floor(eased * target).toLocaleString('pt-BR');
      if (progress < 1) requestAnimationFrame(step);
      else el.textContent = target.toLocaleString('pt-BR');
    }
    requestAnimationFrame(step);
  }

  function pulseEye() {
    var badge = document.getElementById('viewsBadge');
    if (badge) {
      badge.classList.add('pulse');
      setTimeout(function(){ badge.classList.remove('pulse'); }, 700);
    }
  }

  fetch('/api/views?t=' + Date.now(), { method: 'GET', cache: 'no-store', headers: { 'Cache-Control': 'no-cache', Pragma: 'no-cache' } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (typeof d.count === 'number') {
        animateCount(d.count);
        pulseEye();
      }
    })
    .catch(function() {});
})();

// ── Reverb + eco (espaço vazio) ───────────────────────────
var reverbCtx=null,reverbSource=null,convolver=null,reverbGain=null,dryGain=null,masterGain=null;
function initReverb(){
  if(reverbCtx)return;
  try{
    reverbCtx=new(window.AudioContext||window.webkitAudioContext)();
    reverbSource=reverbCtx.createMediaElementSource(audio);

    masterGain=reverbCtx.createGain();
    masterGain.gain.value=1;
    masterGain.connect(reverbCtx.destination);

    dryGain=reverbCtx.createGain();
    dryGain.gain.value=0.38;

    reverbGain=reverbCtx.createGain();
    reverbGain.gain.value=0.78;

    var preDelay=reverbCtx.createDelay(0.12);
    preDelay.delayTime.value=0.042;

    var wetFilter=reverbCtx.createBiquadFilter();
    wetFilter.type='highpass';
    wetFilter.frequency.value=160;
    wetFilter.Q.value=0.7;

    convolver=reverbCtx.createConvolver();
    var rate=reverbCtx.sampleRate;
    var len=Math.floor(rate*6.2);
    var impulse=reverbCtx.createBuffer(2,len,rate);
    for(var ch=0;ch<2;ch++){
      var data=impulse.getChannelData(ch);
      for(var i=0;i<len;i++){
        var t=i/len;
        var decay=Math.pow(1-t,2.15);
        var early=(i<rate*0.14)?Math.sin(i*0.06*(ch+1.2))*0.32*(1-i/(rate*0.14)):0;
        data[i]=(Math.random()*2-1)*decay*0.82+early;
      }
    }
    convolver.buffer=impulse;

    var echoDelay=reverbCtx.createDelay(1.4);
    echoDelay.delayTime.value=0.36;
    var echoFb=reverbCtx.createGain();
    echoFb.gain.value=0.31;
    var echoWet=reverbCtx.createGain();
    echoWet.gain.value=0.24;

    var echoDelay2=reverbCtx.createDelay(2.0);
    echoDelay2.delayTime.value=0.78;
    var echoWet2=reverbCtx.createGain();
    echoWet2.gain.value=0.16;

    analyser=reverbCtx.createAnalyser();
    analyser.fftSize=512;
    analyser.smoothingTimeConstant=0.82;
    dataArr=new Uint8Array(analyser.frequencyBinCount);

    reverbSource.connect(dryGain);
    dryGain.connect(masterGain);

    reverbSource.connect(preDelay);
    preDelay.connect(convolver);
    convolver.connect(wetFilter);
    wetFilter.connect(reverbGain);
    reverbGain.connect(masterGain);

    reverbSource.connect(echoDelay);
    echoDelay.connect(echoWet);
    echoWet.connect(masterGain);
    echoDelay.connect(echoFb);
    echoFb.connect(echoDelay);

    reverbSource.connect(echoDelay2);
    echoDelay2.connect(echoWet2);
    echoWet2.connect(masterGain);

    masterGain.connect(analyser);
    analyser.connect(reverbCtx.destination);

    audioCtx=reverbCtx;
  }catch(e){}
}

// ── Web Audio Analyser ────────────────────────────────────
var audioCtx=null,analyser=null,source=null,dataArr=null,rafId=null;
var mbBars=[
  document.getElementById('mbBar1'),
  document.getElementById('mbBar2'),
  document.getElementById('mbBar3'),
  document.getElementById('mbBar4')
];
// Bandas de frequência: sub-bass, bass, mid, high-mid
var bands=[3,8,18,36];

function initAudioCtx(){
  if(audioCtx)return;
  initReverb();
}

function eqLoop(){
  if(!analyser||!dataArr){rafId=null;return;}
  rafId=requestAnimationFrame(eqLoop);
  analyser.getByteFrequencyData(dataArr);
  mbBars.forEach(function(bar,i){
    if(!bar)return;
    var val=dataArr[bands[i]]||0;
    // mapeia 0-255 → 3px-24px com boost de sensibilidade
    var normalized=Math.min(1,val/180);
    var h=3+Math.round(normalized*21);
    bar.style.height=h+'px';
  });
}

function startEqLoop(){if(rafId)return;eqLoop();}
function stopEqLoop(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  var defaults=[4,8,5,10];
  mbBars.forEach(function(bar,i){if(bar)bar.style.height=defaults[i]+'px';});
}

function loadTrack(idx){
  var t=playlist[idx];
  audio.src=t.src;
  if(mpTitle)mpTitle.textContent=t.title;
  if(mpArtist)mpArtist.textContent=t.artist;
  if(mpDur)mpDur.textContent='00:00';
  if(mpCur)mpCur.textContent='00:00';
  if(mpFill)mpFill.style.width='0%';
  if(mpThumb)mpThumb.style.left='0%';
  if(mpCover && t.cover) mpCover.src = t.cover;
}

var _volFadeTimer = null;
var _targetVol = 0.7; // volume alvo padrão

function fadeVolumeTo(target, duration) {
  if (_volFadeTimer) clearInterval(_volFadeTimer);
  var start = audio.volume;
  var steps = 40;
  var stepTime = duration / steps;
  var delta = (target - start) / steps;
  var step = 0;
  _volFadeTimer = setInterval(function() {
    step++;
    var v = Math.min(1, Math.max(0, start + delta * step));
    audio.volume = v;
    if (mpVol) mpVol.value = v;
    updateVolIcon(v);
    if (step >= steps) {
      clearInterval(_volFadeTimer);
      _volFadeTimer = null;
      audio.volume = target;
      if (mpVol) mpVol.value = target;
      updateVolIcon(target);
    }
  }, stepTime);
}

function updateVolIcon(v) {
  var w1 = document.getElementById('mpVolWave1');
  var w2 = document.getElementById('mpVolWave2');
  if (w1) w1.style.opacity = v > 0.05 ? '1' : '0';
  if (w2) w2.style.opacity = v > 0.4  ? '1' : '0';
}

function playTrack(){
  initReverb();
  if(reverbCtx&&reverbCtx.state==='suspended')reverbCtx.resume();
  initAudioCtx();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  // Começa no volume atual (baixo na primeira vez) e sobe suavemente
  audio.play().catch(function(err){
    console.warn('Áudio bloqueado ou ficheiro em falta:', err);
  });
  fadeVolumeTo(_targetVol, 1800); // 1.8s de fade-in
  if(mpIPlay)mpIPlay.style.display='none';
  if(mpIPause)mpIPause.style.display='block';
  if(mpPlay)mpPlay.classList.add('playing');
  var btn=document.getElementById('musicBtn');
  if(btn){btn.classList.add('playing');btn.classList.remove('paused');}
  startEqLoop();
}

function pauseTrack(){
  audio.pause();
  if(mpIPlay)mpIPlay.style.display='block';
  if(mpIPause)mpIPause.style.display='none';
  if(mpPlay)mpPlay.classList.remove('playing');
  var btn=document.getElementById('musicBtn');
  if(btn){btn.classList.remove('playing');btn.classList.add('paused');}
  stopEqLoop();
}

function nextTrack(){trackIdx=(trackIdx+1)%playlist.length;loadTrack(trackIdx);playTrack();}
function mpNext(){nextTrack();}
function mpPrev(){trackIdx=(trackIdx-1+playlist.length)%playlist.length;loadTrack(trackIdx);playTrack();}

audio.addEventListener('loadedmetadata',function(){
  if(mpDur)mpDur.textContent=fmt(audio.duration);
});
audio.addEventListener('timeupdate',function(){
  if(!audio.duration)return;
  var pct=(audio.currentTime/audio.duration)*100;
  if(mpFill)mpFill.style.width=pct+'%';
  if(mpThumb)mpThumb.style.left=pct+'%';
  if(mpCur)mpCur.textContent=fmt(audio.currentTime);

// Convites conhecidos (guildId → código). Carrega /guild-invites.json + cache do navegador.
var GUILD_INVITE_OVERRIDES = {};
var INVITE_CACHE_KEY = 'jjxvnz-guild-invite-v1';

function getCachedGuildInvite(guildId) {
  try {
    return localStorage.getItem(INVITE_CACHE_KEY + ':' + guildId) || '';
  } catch (e) { return ''; }
}

function setCachedGuildInvite(guildId, code) {
  var c = String(code || '').replace(/^https?:\/\/(www\.)?discord\.(gg|com\/invite)\//i, '').split('?')[0];
  if (!guildId || !c) return;
  try { localStorage.setItem(INVITE_CACHE_KEY + ':' + guildId, c); } catch (e) {}
}

function resolveGuildInviteCode(guildId, tagLabel) {
  return getCachedGuildInvite(guildId) || GUILD_INVITE_OVERRIDES[guildId] || '';
}

fetch('/guild-invites.json')
  .then(function(r) { return r.ok ? r.json() : {}; })
  .then(function(map) {
    if (map && typeof map === 'object') {

        if (k.charAt(0) !== '_' && /^\d+$/.test(k)) GUILD_INVITE_OVERRIDES[k] = map[k];
      });
    }
  })
  .catch(function() {});

(function(){

  window._loadTagIcon = function(el, guildId, badgeHash, tagLabel) {

    var gid = String(guildId);

    var label = String(tagLabel || '');

    function mount(urls, next) {
      if (gen !== tagIconGen) return;

      var img = document.createElement('img');
      img.width = 14;
      img.height = 14;
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      img.style.cssText = 'border-radius:2px;object-fit:contain;vertical-align:middle;display:inline-block;';
      var i = 0;

        else { el.innerHTML = ''; if (next) next(); }

      el.appendChild(img);

        el.onerror = function() {
          this.src = 'https://cdn.discordapp.com/avatar-decoration-presets/' + asset + '.png?size=256';

    applyDecoration(decorEl,  decor ? decor.asset : null);
    applyDecoration(decorEl2, decor ? decor.asset : null);

    // Username
    var nameEl = document.getElementById('discordName');

  // ── REST primeiro (resposta rápida), depois WebSocket (tempo real) ──
  // Isso reduz drasticamente o tempo de primeira carga em mobile
  fetch('https://api.lanyard.rest/v1/users/' + DISCORD_ID, { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(json) {

        clearTimeout(lanyardTimeout);

    .catch(function(){});

  function connectWS() {
    ws = new WebSocket('wss://api.lanyard.rest/socket');
    ws.onmessage = function(event) {
      var msg = JSON.parse(event.data);
      if (msg.op === 1) {
        ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
        heartbeat = setInterval(function() {
          if (ws.readyState === 1) ws.send(JSON.stringify({ op: 3 }));
        }, msg.d.heartbeat_interval);

        if (msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE') {
          lanyardConnected = true;
          window.lanyardConnected = true;
          clearTimeout(lanyardTimeout);
          updatePresence(msg.d);

    var end = parseInt(bar.getAttribute('data-end'));

    var now = Date.now();
    var duration = Math.floor((end - start) / 1000);
    var elapsed = Math.min(Math.floor((now - start) / 1000), duration);

    var elapsedEl = spotifyCard.querySelector('[data-elapsed]');

// ── Server Tag Tooltip (info do servidor ao hover — qualquer tag do Discord) ──
(function(){
  var currentGuildId = null;

  var tooltipRenderGen = 0;
  var serverCache = {};
  var GUILD_CACHE_TTL = 90000;

    if (!d) return;
    var code = '';
    if (d.inviteCode) code = d.inviteCode;
    else if (d.inviteUrl) code = d.inviteUrl.replace(/^https?:\/\/(www\.)?discord\.gg\//i, '');
    if (code) setCachedGuildInvite(id, code);

  window._onGuildTagChange = function(newGuildId, newTag, oldGuildId) {
    if (oldGuildId && oldGuildId !== newGuildId) {
      delete serverCache[oldGuildId];
    }
    if (newGuildId) {
      delete serverCache[newGuildId];
      currentGuildId = String(newGuildId);
      currentTagLabel = newTag || '';
    }
  };

  function assetExt(hash) {
    return hash && hash.indexOf('a_') === 0 ? 'gif' : 'png';
  }

  function discordAssetUrls(kind, guildId, hash, size) {
    if (!hash || !guildId) return [];
    var ext = assetExt(hash);
    var folder = kind === 'icon' ? 'icons' : (kind === 'banner' ? 'banners' : 'splashes');
    var hosts = ['https://media.discordapp.net', 'https://cdn.discordapp.com'];
    var urls = [];
    hosts.forEach(function(host) {
      urls.push(host + '/' + folder + '/' + guildId + '/' + hash + '.' + ext + '?size=' + size);
      if (ext === 'gif') urls.push(host + '/' + folder + '/' + guildId + '/' + hash + '.png?size=' + size);
    });
    var seen = {};
    return urls.filter(function(u) { if (seen[u]) return false; seen[u] = true; return true; });
  }

  function inviteUrlFromCode(code) {
    if (!code) return '';
    var clean = String(code).replace(/^https?:\/\/(www\.)?discord\.(gg|com\/invite)\//i, '').split('?')[0];
    return clean ? 'https://discord.gg/' + clean : '';
  }

  function isActiveRender(guildId, gen) {
    return gen === tooltipRenderGen && String(currentGuildId) === String(guildId);
  }

    var iconEl = document.getElementById('sttIcon');

      iconEl.innerHTML = '';
      iconEl.textContent = '';

    if (!badgeHash || !guildId) return '';
    return 'https://cdn.discordapp.com/clan-badges/' + guildId + '/' + badgeHash + '.png?size=128';
  }

  function mountDiscordImg(el, urls, fallbackText, guildId, gen) {
    el.innerHTML = '';

      el.textContent = fallbackText || '?';

    }
    var img = document.createElement('img');
    img.alt = '';
    img.referrerPolicy = 'no-referrer';
    img.decoding = 'async';
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:9px;display:block;';
    var i = 0;
    img.onerror = function() {
      if (!isActiveRender(guildId, gen)) return;
      i++;
      if (i < urls.length) img.src = urls[i];
      else {
        el.innerHTML = '';
        el.textContent = fallbackText || '?';
      }
    };
    img.onload = function() {
      if (!isActiveRender(guildId, gen)) return;
    };
    el.appendChild(img);
    img.src = urls[0];
  }

    if (!isActiveRender(guildId, gen)) return;
    bannerEl.innerHTML = '';
    if (!urls || !urls.length) return;

    img.alt = '';
    img.referrerPolicy = 'no-referrer';
    img.decoding = 'async';
    var n = 0;
    img.onerror = function() {
      if (!isActiveRender(guildId, gen)) return;
      n++;
      if (n < urls.length) img.src = urls[n];

    if (!isActiveRender(guildId, gen)) return;
    var d = serverCache[guildId];
    if (!d || !d.available || String(d.guildId) !== String(guildId)) return;

    resetTooltipVisuals();
    if (!isActiveRender(guildId, gen)) return;

    var iconEl = document.getElementById('sttIcon');
    var nameEl = document.getElementById('sttName');
    var onlineEl = document.getElementById('sttOnline');
    var membersEl = document.getElementById('sttMembers');
    var descEl = document.getElementById('sttDesc');
    var bannerEl = document.getElementById('sttBanner');

    if (iconEl) {
      var iconUrls = (d.iconUrls && d.iconUrls.length) ? d.iconUrls.slice() : [];
      if (d.iconUrl && iconUrls.indexOf(d.iconUrl) === -1) iconUrls.unshift(d.iconUrl);
      if (!iconUrls.length && d.iconHash) iconUrls = discordAssetUrls('icon', guildId, d.iconHash, 128);
      mountDiscordImg(iconEl, iconUrls, (d.name || '?').charAt(0), guildId, gen);
    }

    if (bannerEl) {
      var bUrls = (d.bannerUrls && d.bannerUrls.length) ? d.bannerUrls.slice() : (d.bannerUrl ? [d.bannerUrl] : []);
      setBannerImage(bannerEl, bUrls, guildId, gen);
    }

    if (nameEl) nameEl.textContent = d.name || '';
    if (onlineEl) onlineEl.textContent = (d.online != null && d.online !== '') ? Number(d.online).toLocaleString('pt-BR') : '0';
    if (membersEl) membersEl.textContent = (d.members != null && d.members !== '') ? Number(d.members).toLocaleString('pt-BR') : '—';
    if (descEl) descEl.textContent = d.desc || '';

    var joinEl = document.getElementById('sttJoin');
    if (joinEl) {
      var invite = d.inviteUrl || inviteUrlFromCode(resolveGuildInviteCode(guildId, currentTagLabel));
      if (invite) {
        joinEl.href = invite;
        joinEl.classList.remove('stt-join-off');
      } else {
        joinEl.href = '#';
        joinEl.classList.add('stt-join-off');
      }
    }
  }

  window._updateServerTooltip = function(guildId, badgeHash, tagLabel, forceRefresh) {
    if (!guildId) return;
    var gid = String(guildId);
    currentGuildId = gid;
    currentTagLabel = tagLabel || '';
    var gen = ++tooltipRenderGen;
    resetTooltipVisuals();

    var tooltipEl = document.getElementById('serverTooltip');

    fetchServerData(gid, currentTagLabel, function(){
      if (!isActiveRender(gid, gen)) return;
      var d = serverCache[gid];
      if (!hasCompleteStats(d) || String(d.guildId) !== gid) {
        if (tooltipEl) tooltipEl.classList.add('stt-hidden');
        return;
      }

      var iconUrls = (d.iconUrls && d.iconUrls.length) ? d.iconUrls.filter(function(u) {
        return u.indexOf('/clan-badges/') === -1;
      }) : [];
      if (d.iconUrl && iconUrls.indexOf(d.iconUrl) === -1) iconUrls.unshift(d.iconUrl);
      if (!iconUrls.length && d.iconHash) iconUrls = discordAssetUrls('icon', gid, d.iconHash, 128);
      var badgeUrl = clanBadgeUrl(gid, badgeHash);
      if (badgeUrl) iconUrls.push(badgeUrl);
      d.iconUrls = iconUrls;

      if (tooltipEl) tooltipEl.classList.remove('stt-hidden');
      renderTooltip(gid, gen);
    }, !!forceRefresh);
  };

  setInterval(function() {
    if (!currentGuildId) return;
    fetchServerData(currentGuildId, currentTagLabel, function() {
      var d = serverCache[currentGuildId];
      if (hasCompleteStats(d)) renderTooltip(currentGuildId, tooltipRenderGen);
    }, true);
  }, GUILD_CACHE_TTL);

  // Mantém o card aberto ao mover o mouse da tag até o botão Entrar
  (function initTooltipHover() {
    var wrap = document.getElementById('serverTagWrap');
    var tooltip = document.getElementById('serverTooltip');
    if (!wrap || !tooltip) return;
    var closeTimer = null;

    function canOpen() {
      return !tooltip.classList.contains('stt-hidden');
    }

    function open() {
      clearTimeout(closeTimer);
      if (canOpen()) wrap.classList.add('stt-open');
    }

    function close() {
      clearTimeout(closeTimer);
      closeTimer = setTimeout(function() {
        wrap.classList.remove('stt-open');
      }, 160);
    }

    wrap.addEventListener('mouseenter', open);
    wrap.addEventListener('mouseleave', close);
    tooltip.addEventListener('mouseenter', open);
    tooltip.addEventListener('mouseleave', close);
  })();
})();
</script>
</body></html>
